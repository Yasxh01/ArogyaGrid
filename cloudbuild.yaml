steps:
  # 1. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/arogyagrid-backend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/arogyagrid-backend:latest', './backend']
    id: 'build-backend'

  # 2. Build Frontend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/arogyagrid-frontend:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/arogyagrid-frontend:latest', './frontend']
    id: 'build-frontend'

  # 3. Push Docker Images to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/arogyagrid-backend:$COMMIT_SHA']
    id: 'push-backend'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/arogyagrid-frontend:$COMMIT_SHA']
    id: 'push-frontend'

  # 4. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'arogyagrid-backend'
      - '--image=gcr.io/$PROJECT_ID/arogyagrid-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'
      - '--set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_AI_REGION=asia-south1,BIGQUERY_DATASET=arogyagrid_analytics'
    id: 'deploy-backend'

  # 5. Deploy Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'arogyagrid-frontend'
      - '--image=gcr.io/$PROJECT_ID/arogyagrid-frontend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
    id: 'deploy-frontend'

images:
  - 'gcr.io/$PROJECT_ID/arogyagrid-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/arogyagrid-backend:latest'
  - 'gcr.io/$PROJECT_ID/arogyagrid-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/arogyagrid-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
